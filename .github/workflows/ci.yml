name: CI

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - '**.md'
  pull_request: {}
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  BUILD_SDK_VER: "10.0.x"
  BUILD_SDK_MIN_VER: "10.0.100"
  MAIN_TFM: "net10.0"

jobs:
  build-and-test-netfw:
    strategy:
      matrix:
        dotnet-version: [
          {sdk: "4.6.2", tfm: net462},
          {sdk: "4.8.1", tfm: net481},
        ]
    name: Build & test on .NET ${{ matrix.dotnet-version.sdk }}
    runs-on: windows-latest
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.BUILD_SDK_VER }}

      - uses: actions/checkout@v7

      - name: Build core test project
        run: |
          dotnet build test/Acornima.Tests/Acornima.Tests.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}

      - name: Run core tests
        run: |
          dotnet test --project test/Acornima.Tests/Acornima.Tests.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} --no-build /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}

  build-and-test-netcore:
    strategy:
      matrix:
        dotnet-version: [
          {sdk: "2.1.x", tfm: netcoreapp2.1}, # for testing the netstandard2.0 build
          {sdk: "3.1.x", tfm: netcoreapp3.1}, # for testing the netstandard2.1 build
          {sdk: "8.0.x", tfm: net8.0},
          {sdk: "9.0.x", tfm: net9.0},
          {sdk: "10.0.x", tfm: net10.0},
          {sdk: "11.0.x", tfm: net11.0}
        ]
        os: [ubuntu-latest, windows-latest, macOS-latest]
        exclude:
          - dotnet-version: {sdk: "2.1.x", tfm: netcoreapp2.1}
            os: ubuntu-latest
          - dotnet-version: {sdk: "2.1.x", tfm: netcoreapp2.1}
            os: macOS-latest
          - dotnet-version: {sdk: "3.1.x", tfm: netcoreapp3.1}
            os: ubuntu-latest
          - dotnet-version: {sdk: "3.1.x", tfm: netcoreapp3.1}
            os: macOS-latest
    name: Build & test on .NET ${{ matrix.dotnet-version.sdk }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            ${{ env.BUILD_SDK_VER }}
            ${{ matrix.dotnet-version.sdk }}

      - uses: actions/checkout@v7

      - name: Cache Test262 generated suite
        if: matrix.dotnet-version.tfm == env.MAIN_TFM
        uses: actions/cache@v5
        with:
          path: test/Acornima.Tests.Test262/Generated
          key: test262-generated-${{ hashFiles('test/Acornima.Tests.Test262/Test262Harness.settings.json') }}

      - name: Set roll-forward to latestMajor
        run: |
          dotnet new global.json --sdk-version ${{ env.BUILD_SDK_MIN_VER }} --roll-forward latestMajor --test-runner Microsoft.Testing.Platform --force

      - name: Build core test project
        if: matrix.dotnet-version.tfm != env.MAIN_TFM
        run: |
          dotnet build test/Acornima.Tests/Acornima.Tests.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}

      - name: Build solution
        if: matrix.dotnet-version.tfm == env.MAIN_TFM
        run: |
          dotnet build Acornima.slnx -c Release

      - name: Run core tests
        if: matrix.dotnet-version.tfm != env.MAIN_TFM
        run: |
          dotnet test --project test/Acornima.Tests/Acornima.Tests.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} --no-build /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}

      - name: Run all tests
        if: matrix.dotnet-version.tfm == env.MAIN_TFM
        run: |
          dotnet test --solution Acornima.slnx -c Release -f ${{ matrix.dotnet-version.tfm }} --no-build

  build-and-test-nativeaot:
    strategy:
      matrix:
        dotnet-version: [
          {sdk: "10.0.x", tfm: net10.0},
          {sdk: "11.0.x", tfm: net11.0},
        ]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    name: Build & test on .NET NativeAOT ${{ matrix.dotnet-version.sdk }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            ${{ env.BUILD_SDK_VER }}
            ${{ matrix.dotnet-version.sdk }}

      - uses: actions/checkout@v7

      - name: Set roll-forward to latestMajor
        run: |
          dotnet new global.json --sdk-version ${{ env.BUILD_SDK_MIN_VER }} --roll-forward latestMajor --test-runner Microsoft.Testing.Platform --force

      - name: Publish test project
        run: |
          dotnet publish test/Acornima.Tests.NativeAOT/Acornima.Tests.NativeAOT.csproj -c Release -f ${{ matrix.dotnet-version.tfm }} -o artifacts/publish /p:CITargetFramework=${{ matrix.dotnet-version.tfm }}

      - name: Run tests
        run: |
          artifacts/publish/Acornima.Tests.NativeAOT

  publish:
    needs: [
      build-and-test-netfw,
      build-and-test-netcore,
      build-and-test-nativeaot
    ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      id-token: write # enable GitHub OIDC token issuance for this job
    steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.BUILD_SDK_VER }}

    - uses: actions/checkout@v7

    - name: Determine version from tag
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        arrTag=(${GITHUB_REF//\// })
        VERSION="${arrTag[2]}"
        VERSION="${VERSION#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    - name: Generate preview version
      if: "!startsWith(github.ref, 'refs/tags/')"
      run: |
        VERSION="0.1.0-preview-$(date -u +'%Y%m%d-%H%M')"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"

    # See also: https://andrewlock.net/version-vs-versionsuffix-vs-packageversion-what-do-they-all-mean/
    - name: Build
      run: |
        dotnet build Acornima.slnx -c Release /p:ContinuousIntegrationBuild=true /p:Version=$VERSION /p:BuildNumber=$GITHUB_RUN_NUMBER

    - name: Pack
      run: |
        dotnet pack Acornima.slnx -c Release --no-build /p:Version=$VERSION /p:BuildNumber=$GITHUB_RUN_NUMBER

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: packages
        path: artifacts/package/release

    # Symbol packages are auto-pushed, see: https://learn.microsoft.com/en-us/nuget/create-packages/symbol-packages-snupkg#publishing-a-symbol-package
    - name: Push to Feedz
      env:
        NUGET_API_KEY: ${{ secrets.FEEDZ_NUGET_API_KEY }}
      run: |
        dotnet nuget push artifacts/package/release/*.nupkg --api-key "$NUGET_API_KEY" --source https://f.feedz.io/acornima/acornima/nuget/index.json

    - name: Log in to NuGet (OIDC → temp API key)
      if: startsWith(github.ref, 'refs/tags/')
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      if: startsWith(github.ref, 'refs/tags/')
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push artifacts/package/release/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
